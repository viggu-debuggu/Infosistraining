apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillsphere-backend
  namespace: skillsphere-nexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: skillsphere-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: skillsphere-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillsphere-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillsphere-secret
                  key: JWT_SECRET
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillsphere-secret
                  key: INITIAL_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: skillsphere-nexus
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: backend
