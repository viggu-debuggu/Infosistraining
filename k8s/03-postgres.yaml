apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: skillsphere-nexus
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "skillsphere_db"
            - name: POSTGRES_USER
              value: "skillsphere"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillsphere-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: skillsphere-nexus
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
