apiVersion: v1
kind: ConfigMap
metadata:
  name: skillsphere-config
  namespace: skillsphere-nexus
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_URL: "jdbc:postgresql://postgres-service:5432/skillsphere_db"
  DB_USERNAME: "skillsphere"
  SPRING_REDIS_HOST: "redis-service"
  SPRING_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  INITIAL_ADMIN_USERNAME: "admin@skillsphere.com"
